[project]
name = "cloudpss-agent-skills"
version = "0.1.0"
description = "CloudPSS team skill repository scaffold and governance tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
