name: Skill Checks

on:
  pull_request:
    paths:
      - ".github/workflows/skill-checks.yml"
      - "pyproject.toml"
      - "src/cloudpss_skillrepo/**"
      - "skills/**"

jobs:
  detect-changed-skills:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed skills
        id: detect
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          mapfile -t changed_skills < <(
            git diff --name-only "$base_sha" "$head_sha" -- "skills/**" |
            awk -F/ '/^skills\/[^/]+\// { print $2 }' |
            sort -u
          )

          if [[ ${#changed_skills[@]} -eq 0 ]]; then
            echo "skills=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No changed skills detected."
            exit 0
          fi

          skills_json="$(printf '%s\n' "${changed_skills[@]}" | jq -R . | jq -cs .)"
          echo "skills=$skills_json" >> "$GITHUB_OUTPUT"
          echo "count=${#changed_skills[@]}" >> "$GITHUB_OUTPUT"
          echo "Detected changed skills: $skills_json"

  validate-changed-skills:
    needs: detect-changed-skills
    if: needs.detect-changed-skills.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changed-skills.outputs.skills) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate skill structure
        run: python -m src.cloudpss_skillrepo validate-skill skills/${{ matrix.skill }}

      - name: Reject sensitive and generated files
        shell: bash
        run: |
          skill_dir="skills/${{ matrix.skill }}"

          test ! -f "$skill_dir/.env"
          test ! -f "$skill_dir/.cloudpss_token"
          test ! -d "$skill_dir/artifacts"
          test ! -d "$skill_dir/__pycache__"
          test ! -d "$skill_dir/mylib/__pycache__"
          test ! -d "$skill_dir/scripts/__pycache__"

  release-check:
    needs: detect-changed-skills
    if: needs.detect-changed-skills.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run repository release check
        run: python -m src.cloudpss_skillrepo release-check
